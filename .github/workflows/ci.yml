name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workspace:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - run: cargo run --locked -p stratum-cli -- api openapi --json > /tmp/stratum-openapi.json
      - run: diff -u docs/openapi.json /tmp/stratum-openapi.json
      - run: tar -czf "stratum-${RUNNER_OS}.tar.gz" target/release/stratum target/release/stratum-desktop target/release/stratum-tui docs/openapi.json LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v7
        with:
          name: stratum-${{ runner.os }}
          path: stratum-${{ runner.os }}.tar.gz
          if-no-files-found: error
