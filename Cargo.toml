[workspace]
resolver = "2"
members = ["crates/domain", "crates/platform", "crates/index", "crates/engine", "crates/api", "crates/cli", "crates/desktop", "crates/tui"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
stratum-domain = { path = "crates/domain" }
stratum-platform = { path = "crates/platform" }
stratum-index = { path = "crates/index" }
stratum-engine = { path = "crates/engine" }
stratum-api = { path = "crates/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.38", features = ["bundled"] }
blake3 = "1"
tempfile = "3"
utoipa = { version = "5", features = ["axum_extras"] }
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
